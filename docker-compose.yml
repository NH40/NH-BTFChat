x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Имя проекта зафиксировано: на сервере каталог /root/NH-BTFChat, и том данных
# старой версии называется nh-btfchat_pgdata — смена имени потеряла бы базу.
name: nh-btfchat

# Сервер общий с UAP и LBP (2 GB RAM) — у каждого сервиса свой mem_limit.
# Наружу ничего не публикуется: домен btf.universanimeplanet.ru обслуживает Caddy проекта
# UAP (../NH-Universe-Anime-Planet/Caddyfile) через общую внешнюю сеть `edge`
# (создаётся один раз: `docker network create edge`).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 48m
    logging: *default-logging

  # Бот: миграции при старте (docker/entrypoint.sh без аргументов), затем polling.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    logging: *default-logging

  # API Mini App — тот же образ, другая команда (миграции не гоняет — их делает bot).
  api:
    build: .
    container_name: btf_api
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    networks:
      - default
      - edge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 192m
    logging: *default-logging

  # Статика Mini App (внутренний HTTP :80 в сети edge, TLS — у Caddy UAP).
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: btf_web
    restart: unless-stopped
    networks:
      - edge
    mem_limit: 32m
    logging: *default-logging

volumes:
  pgdata:

networks:
  edge:
    external: true
